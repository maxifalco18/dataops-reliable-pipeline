name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest -v

      - name: End-to-end smoke run
        run: |
          python scripts/generate_sample_data.py --out /tmp/input
          dataops-pipeline --input-dir /tmp/input --db /tmp/warehouse.db
          # Second run must be a no-op (idempotency + watermark)
          dataops-pipeline --input-dir /tmp/input --db /tmp/warehouse.db
